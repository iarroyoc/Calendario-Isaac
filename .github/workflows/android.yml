name: Compilar Calendario Isaac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          unzip -o CalendarioIsaac.zip -d fuentes
          test -f fuentes/CalendarioIsaac_Android/settings.gradle.kts

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: fuentes/CalendarioIsaac_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Isaac-APK
          path: fuentes/CalendarioIsaac_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
