name: Compilar Calendario Isaac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          mkdir -p fuentes
          unzip -o CalendarioIsaac.zip -d fuentes

      - name: Localizar proyecto Android
        id: localizar
        run: |
          ARCHIVO=$(find fuentes -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: No se encuentra settings.gradle ni settings.gradle.kts dentro del ZIP."
            echo "Contenido del ZIP:"
            find fuentes -maxdepth 5 -type f | head -100
            exit 1
          fi

          CARPETA=$(dirname "$ARCHIVO")
          echo "project_dir=$CARPETA" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $CARPETA"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.localizar.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Isaac-APK
          path: ${{ steps.localizar.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
